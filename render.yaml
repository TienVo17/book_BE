services:
  - name: book-be
    type: web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_REFRESH_ENABLED
        value: "false"
      - key: AUTH_REFRESH_HMAC_KEY
        sync: false
      - key: AUTH_CSRF_HMAC_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://tienvo17.vercel.app
