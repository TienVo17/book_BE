services:
  mysql:
    image: mysql:8.0
    container_name: web_ban_sach_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: web_ban_sach
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web_ban_sach_be
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/web_ban_sach?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ""
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      # Mac dinh giu Gmail de cau hinh cu khong doi hanh vi dot ngot. Doi nha cung cap
      # chi can dat MAIL_HOST/MAIL_PORT trong .env, khong sua file nay va khong sua code.
      # Mailjet: MAIL_HOST=in-v3.mailjet.com, MAIL_PORT=587, MAIL_USERNAME=<API Key>,
      # MAIL_PASSWORD=<Secret Key> — KHONG phai email/mat khau dang nhap Mailjet.
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # Registration and password reset refuse to report success when no sender
      # is configured, so local runs need a value. This default is a reserved
      # example.com address: it never routes anywhere real.
      MAIL_FROM: ${MAIL_FROM:-no-reply@example.com}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      FRONTEND_URL: http://localhost:3000
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ../book_FE
      dockerfile: Dockerfile
    container_name: web_ban_sach_fe
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
