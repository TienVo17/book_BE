server.port=${PORT:8080}
logging.pattern.level=%5p traceId=%X{traceId:-none}

spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:web_ban_sach}}
spring.datasource.username=${DB_USERNAME:${DB_USER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQL_PASSWORD:}}

# Hibernate validates schema but does NOT modify it
spring.jpa.hibernate.ddl-auto=validate

# Flyway migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.connect-retries=${FLYWAY_CONNECT_RETRIES:10}
spring.flyway.connect-retries-interval=${FLYWAY_CONNECT_RETRIES_INTERVAL:5}
# Khoi dong binh thuong fail-closed tren lich su dirty; chi bat cho mot lan khoi phuc co chu dich.
app.flyway.repair-on-start=${FLYWAY_REPAIR_ON_START:false}

# Bootstrap admin mot lan (mac dinh tat). Xoa cac bien nay sau khi tao xong.
app.admin-bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin-bootstrap.username=${ADMIN_BOOTSTRAP_USERNAME:}
app.admin-bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin-bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}

# JWT and browser refresh sessions
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.auth.refresh-enabled=${AUTH_REFRESH_ENABLED:false}
# Feature off permits missing keys. Feature on validates both keys at startup.
app.auth.refresh-hmac-key=${AUTH_REFRESH_HMAC_KEY:}
app.auth.csrf-hmac-key=${AUTH_CSRF_HMAC_KEY:}

# Mail
# Host/port doi duoc bang bien moi truong de chuyen nha cung cap ma khong sua code.
# Gui thu hang loat qua tai khoan Gmail ca nhan vua vi pham chinh sach cua Google vua
# nguy hiem: chinh tai khoan do dang gui thu kich hoat va dat lai mat khau, nen bi bop
# bang thong hay khoa se lam chet dang ky chu khong chi chet ban tin.
# Brevo: MAIL_HOST=smtp-relay.brevo.com, MAIL_PORT=587, MAIL_USERNAME=<email dang nhap>,
# MAIL_PASSWORD=<SMTP key>. Mac dinh giu Gmail de cau hinh cu khong doi hanh vi dot ngot.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:}
# smtp (mac dinh, dung o local) hoac mailjet (HTTP API).
# Render goi mien phi CHAN cong SMTP di ra tu 26/09/2025 va ket noi treo den het gio thay vi
# bao loi, nen tren do phai dat MAIL_PROVIDER=mailjet kem MAILJET_API_KEY/MAILJET_SECRET_KEY.
# Cung cap API Key/Secret Key dung cho SMTP, khong can tao them gi.
app.mail.provider=${MAIL_PROVIDER:smtp}
# Mailjet dung DUNG mot cap khoa cho ca SMTP lan API HTTP, nen mac dinh lay lai
# MAIL_USERNAME/MAIL_PASSWORD. Chuyen sang HTTP chi can dat MAIL_PROVIDER=mailjet,
# khong phai them bien nao — cang it thu phai dat dung thi cang it cho de sai.
app.mail.mailjet.api-key=${MAILJET_API_KEY:${MAIL_USERNAME:}}
app.mail.mailjet.secret-key=${MAILJET_SECRET_KEY:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cloudinary
cloudinary.url=${CLOUDINARY_URL:}

# File upload
spring.servlet.multipart.max-file-size=10MB
# Moi endpoint hien tai chi nhan mot file moi request. Chan o container de request lon
# khong duoc dem toan bo 50MB vao heap truoc khi service co co hoi tra loi.
spring.servlet.multipart.max-request-size=10MB

# Browser-facing frontend origin and VNPay redirect target
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:}
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.api-url=${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
