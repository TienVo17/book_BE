name: keep-alive

# Instance backend ngu sau khoang 15 phut khong co traffic. Lan danh thuc mat hang
# chuc giay, du de frontend het ngan sach cho va bao "may chu khong phan hoi" trong
# khi server van song. Ping dinh ky giu instance thuc.
#
# Duong dan duoc chon co cham database, nen pool ket noi cung duoc giu am theo.
# Endpoint la cong khai: khong can secret, khong gui credential.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping public endpoint
        env:
          TARGET: https://book-be-jakn.onrender.com/api/the-loai
        run: |
          set -u
          # Lich chay cua GitHub co the tre vai phut, nen moi lan chay ping nhieu
          # nhip cach nhau de cua so im lang khong keo dai qua nguong ngu.
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              sleep 180
            fi
            code=$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 120 --retry 2 --retry-delay 15 --retry-connrefused \
              "$TARGET" || echo "000")
            echo "attempt=$attempt status=$code"
            if [ "$code" != "200" ]; then
              echo "::warning::Backend tra ve $code thay vi 200"
            fi
          done
