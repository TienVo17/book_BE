name: keep-alive

# Secondary diagnostic only: GitHub schedules can run hours late. The dedicated
# external heartbeat is configured separately in ops/keep-alive/wrangler.jsonc.

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Ping public endpoint
        env:
          TARGET: https://book-be-jakn.onrender.com/api/the-loai
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 60 \
            --retry 3 --retry-delay 5 --retry-max-time 250 \
            --retry-connrefused --retry-all-errors \
            --write-out 'status=%{http_code} total=%{time_total}s\n' \
            "$TARGET"
